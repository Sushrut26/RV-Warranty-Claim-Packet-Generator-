name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/rv-warranty-claim-mvp-tpfonu]
  workflow_dispatch:

# Allow the workflow to enable Pages and publish via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          # Served from https://<owner>.github.io/<repo>/ , so the app needs the
          # repo name as its base path.
          NEXT_PUBLIC_BASE_PATH: "/RV-Warranty-Claim-Packet-Generator-"
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure Pages (enables Pages on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
